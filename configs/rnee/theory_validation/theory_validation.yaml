experiment:
  id: THEORY_VALIDATION
  stage: ROAD_SEMANTIC_NEGATIVE_CONTROLS
  evidence_tier: FROZEN_PUBLIC_THEORY_VALIDATION
  protocol_frozen_before_execution: true
  protocol_update:
    reason: shared_train_active_mask_is_fixed_for_real_noise_and_permutation_controls
    policy_fixed_before_execution: true
    scope: share_the_real_R6_train_active_mask_across_real_noise_and_permutation_within_each_sensor_regime
    unchanged:
      - target
      - environments
      - systems
      - null_control_draws
      - model
      - seeds
      - sesoi
      - bootstrap
      - decision_rule

inputs:
  m1_pointer: RUN_ROOT/model_contract/feature_contract_latest_pointer.json
  m2_pointer: RUN_ROOT/model_contract/backbone_smoke_latest_pointer.json
  segment_pointer: RUN_ROOT/segment_split/segments_60s_latest_pointer.json
  split_pointer: RUN_ROOT/segment_split/splits_latest_pointer.json
  information_freeze_pointer: RUN_ROOT/model_contract/information_contract_latest_pointer.json
  sensor_factorial_pointer: RUN_ROOT/sensor_factorial/latest_pointer.json

output:
  root: RUN_ROOT/theory_validation
  run_name_prefix: theory_validation
  latest_pointer: RUN_ROOT/theory_validation/latest_pointer.json

data:
  segments: SEGMENT_SPLIT
  splits: SEGMENT_SPLIT
  segment_definition: non_overlapping_60s
  test_assignment_fixed_by_model_contract: true
  allow_cross_dataset_inputs: false
  allow_new_osm_or_map_matching: false

target:
  primary: ICE_operational_fuel_L
  primary_upstream_id: ICE_fuel_L
  secondary: HEV_operational_fuel_L
  secondary_upstream_id: HEV_fuel_L
  unit: L
  source_contract: frozen_MODEL_CONTRACT_target_safe_direct_or_MAF_operational_fuel
  prohibit_direct_fuel_rate_label: true
  prohibit_fuel_battery_pooling: true

features:
  low_sensor: X_L
  low_sensor_count: 8
  high_sensor: X_H
  high_sensor_count: 20
  road_semantic: R6
  road_semantic_count: 142
  systems:
    - L-R0
    - L-R-real
    - L-R-noise
    - L-R-perm
    - H-R0
    - H-R-real
    - H-R-noise
    - H-R-perm

environments:
  - cold_trip
  - cold_month
  - cold_spatial
  - cold_functional_road_class

null_controls:
  noise:
    method: independent_gaussian_from_train_column_moments
    seed: 189010
    training_role_only_for_moments: true
    preserve_recipient_missing_mask: true
    zero_variance_scale: 1.0
  permutation:
    method: whole_R6_block_sattolo_derangement_within_split_role
    seed: 189020
    grouping:
      - split_role
    prohibit_cross_role: true
    prohibit_independent_column_shuffle: true
    preserve_block_row_and_multivariate_missing_pattern_multiset: true

model:
  name: HistGradientBoostingRegressor
  kind: hist_gradient_boosting_l1
  loss: absolute_error
  seeds:
    - 0
    - 1
    - 2
  params:
    early_stopping: false
    l2_regularization: 1.0
    learning_rate: 0.05
    loss: absolute_error
    max_iter: 200
    max_leaf_nodes: 31
    min_samples_leaf: 30
  train_only_variance_filter: true
  active_mask_policy: real_R6_train_active_mask_shared_within_sensor_regime
  minimum_train_rows: 500
  allow_additional_tuning: false
  robustness_models:
    include_robustness_models: false
    reason: THEORY_VALIDATION_implementation_spec_freezes_only_HistGradientBoostingRegressor_and_does_not_freeze_CatBoost_or_Ridge_hyperparameters

evaluation:
  primary_metric: MAE
  secondary_metrics:
    - RMSE
    - MedAE
    - R2
  forbid_mape_smape: true
  ensemble_rule: arithmetic_mean_prediction_across_frozen_seeds
  effect_scale: relative_MAE_gain

bootstrap:
  cluster: vehicle
  hierarchy:
    - vehicle
    - trip
    - segment
  lower_units_within_resampled_vehicle_retained_intact: true
  repetitions: 2000
  confidence: max_t
  alpha: 0.05
  seed: 189030
  families:
    road_gain_per_target: 24
    semantic_specificity_per_target: 16
    pool_primary_and_secondary_targets: false

decision:
  relative_sesoi: 0.055
  cell_pass:
    real_gain_simultaneous_lcb_gt_sesoi: true
    real_minus_noise_simultaneous_lcb_gt_zero: true
    real_minus_permutation_simultaneous_lcb_gt_zero: true
  cross_ood_rule: at_least_three_of_four_cell_passes_with_zero_practical_negative_real_gain_within_a_sensor_regime
  routes:
    - PASS_SEMANTIC_SPECIFICITY
    - FAIL_DIMENSIONAL_EFFECT
    - FAIL_ALIGNMENT
    - CONTEXT_DEPENDENT_ONLY
  primary_decision_target: ICE_operational_fuel_L
  secondary_target_is_supporting_only: true

support:
  minimum_vehicles: 30
  minimum_trips: 5129
  minimum_segments: 30774
  maximum_single_vehicle_segment_share: 0.15
  prospective_floors_are_diagnostic_not_exclusionary: true

integrity:
  preserve_all_negative_environments: true
  alter_sesoi_after_results: false
  alter_bootstrap_after_results: false
  allow_causal_claims: false
  allow_independent_confirmation_claims: false
  allow_external_transfer_claims: false
