experiment:
  id: PHASE1_TARGET_DIAGNOSTICS
  execution_date: 2026-08-01
  evidence_tier: PUBLIC_TARGET_DIAGNOSTICS

inputs:
  segments: data/segments/segments_all.parquet
  static_vehicle_metadata: RUN_ROOT/source_inventory/static_vehicle_metadata.parquet
  feature_contract: RUN_ROOT/model_contract/feature_contract.json
  information_contract: RUN_ROOT/model_contract/information_contract.json
  theory_validation_root: predictions/theory_validation
  robustness_root: RUN_ROOT/robustness
  target_builder: src/rnee_build/02_audit_energy_target.py
  segment_builder: src/rnee_build/35_build_segments.py
  paper: docs/full_reproduction.md

output:
  root: results/rnee_phase1
  run_name_prefix: phase1_target_diagnostics
  latest_pointer: results/rnee_phase1/phase1_target_diagnostics_latest_pointer.json

target:
  id: ICE_fuel_L
  column: fuel_volume_L
  unit: L_per_60s_segment
  operational_definition: direct_Fuel_Rate_when_valid_else_MAF_with_available_trim_correction
  direct_density_g_per_l: 745.0
  stoichiometric_afr: 14.08
  absolute_load_standard_air_density_g_per_l: 1.184
  segment_proxy_limit: product_of_time_weighted_means_not_time_weighted_mean_of_product

environments:
  - cold_trip
  - cold_month
  - cold_spatial
  - cold_functional_road_class

features:
  lower_information:
    - effective_duration_s
    - distance_m_speed_integrated
    - vehicle_speed_km_h_time_weighted_mean
    - vehicle_speed_km_h_time_weighted_std
    - oat_degc_time_weighted_mean
    - oat_degc_time_weighted_std
    - idle_ratio
    - low_speed_ratio
  rpm:
    - engine_rpm_rpm_time_weighted_mean
    - engine_rpm_rpm_time_weighted_std
  absolute_load:
    - absolute_load_pct_time_weighted_mean
    - absolute_load_pct_time_weighted_std
  road_mask_policy: exact_frozen_ROBUSTNESS_real_R6_train_active_mask
  target_source_features_forbidden:
    - maf_g_sec_time_weighted_mean
    - maf_g_sec_time_weighted_std
    - fuel_rate_l_hr_time_weighted_mean
    - fuel_rate_l_hr_time_weighted_std
    - short_term_fuel_trim_bank_1_pct_time_weighted_mean
    - short_term_fuel_trim_bank_1_pct_time_weighted_std
    - short_term_fuel_trim_bank_2_pct_time_weighted_mean
    - short_term_fuel_trim_bank_2_pct_time_weighted_std
    - long_term_fuel_trim_bank_1_pct_time_weighted_mean
    - long_term_fuel_trim_bank_1_pct_time_weighted_std
    - long_term_fuel_trim_bank_2_pct_time_weighted_mean
    - long_term_fuel_trim_bank_2_pct_time_weighted_std

models:
  seeds: [0, 1, 2]
  minimum_train_rows: 500
  hgb:
    params:
      early_stopping: false
      l2_regularization: 1.0
      learning_rate: 0.05
      loss: absolute_error
      max_iter: 200
      max_leaf_nodes: 31
      min_samples_leaf: 30
  ridge:
    params:
      alpha: 1.0
      solver: lsqr
      tol: 0.0001
    preprocessing:
      keep_empty_features: true
  catboost:
    params:
      loss_function: MAE
      eval_metric: MAE
      iterations: 200
      depth: 6
      learning_rate: 0.05
      l2_leaf_reg: 3.0
      random_strength: 1.0
      task_type: GPU
      devices: "0"
      thread_count: 12
      verbose: false
      allow_writing_files: false

null_controls:
  draws_per_type: 20
  types: [noise, permutation]
  reuse_policy: byte_verified_frozen_ROBUSTNESS_controls_only

bootstrap:
  cluster: vehicle
  repetitions: 2000
  alpha: 0.05
  seed: 190030
  relative_sesoi: 0.055
  simultaneous_families:
    hgb_null_gain: 328
    hgb_semantic_specificity: 320
    model_real_gain: 24

proxy_audit:
  model: hgb
  feature_sets:
    rpm_only: [effective_duration_s, engine_rpm_rpm_time_weighted_mean, engine_rpm_rpm_time_weighted_std]
    load_only: [effective_duration_s, absolute_load_pct_time_weighted_mean, absolute_load_pct_time_weighted_std]
    rpm_plus_load: [effective_duration_s, engine_rpm_rpm_time_weighted_mean, engine_rpm_rpm_time_weighted_std, absolute_load_pct_time_weighted_mean, absolute_load_pct_time_weighted_std, absolute_load_x_rpm_mean_product, standardized_absolute_load_rpm_maf_proxy_g_s]
    lower_information: [effective_duration_s, distance_m_speed_integrated, vehicle_speed_km_h_time_weighted_mean, vehicle_speed_km_h_time_weighted_std, oat_degc_time_weighted_mean, oat_degc_time_weighted_std, idle_ratio, low_speed_ratio]
    lower_plus_rpm: [effective_duration_s, distance_m_speed_integrated, vehicle_speed_km_h_time_weighted_mean, vehicle_speed_km_h_time_weighted_std, oat_degc_time_weighted_mean, oat_degc_time_weighted_std, idle_ratio, low_speed_ratio, engine_rpm_rpm_time_weighted_mean, engine_rpm_rpm_time_weighted_std]
    lower_plus_load: [effective_duration_s, distance_m_speed_integrated, vehicle_speed_km_h_time_weighted_mean, vehicle_speed_km_h_time_weighted_std, oat_degc_time_weighted_mean, oat_degc_time_weighted_std, idle_ratio, low_speed_ratio, absolute_load_pct_time_weighted_mean, absolute_load_pct_time_weighted_std]
    lower_plus_rpm_load: [effective_duration_s, distance_m_speed_integrated, vehicle_speed_km_h_time_weighted_mean, vehicle_speed_km_h_time_weighted_std, oat_degc_time_weighted_mean, oat_degc_time_weighted_std, idle_ratio, low_speed_ratio, engine_rpm_rpm_time_weighted_mean, engine_rpm_rpm_time_weighted_std, absolute_load_pct_time_weighted_mean, absolute_load_pct_time_weighted_std, absolute_load_x_rpm_mean_product, standardized_absolute_load_rpm_maf_proxy_g_s]

target_sensitivity:
  thresholds_from: train_only_per_environment
  high_quantile: 0.90
  transient_quantile: 0.75
  stable_quantile: 0.25
  minimum_stratum_rows: 30
  nonidentifiable_regimes:
    - open_loop_enrichment
    - deceleration_fuel_cut

decision:
  absolute_load_independence_requires_documented_independent_measurement: true
  major_result_change_if_reference_hgb_gain_nonpositive: true
  frozen_positive_reference_environments: [cold_trip, cold_month]
  correct_alignment_requires_completed_transfer_stratified_manual_audit: true
  allowed_gate_a:
    - PASS_INDEPENDENT_RICHER_TELEMETRY
    - PASS_AFTER_RPM_ONLY_REDEFINITION
    - FAIL_SENSING_REGIME_CLAIM
  allowed_gate_b:
    - PASS_TARGET_SENSITIVITY
    - PASS_WITH_NARROWED_OPERATIONAL_TARGET_CLAIMS
    - FAIL_TARGET_INTERPRETABILITY
  allowed_gate_c:
    - PASS_CORRECT_ALIGNMENT_LANGUAGE
    - PASS_PIPELINE_ASSIGNED_LANGUAGE_ONLY
    - FAIL_ALIGNMENT_SPECIFICITY_CLAIM
  allowed_overall:
    - PASS_PHASE1_TARGET_DIAGNOSTICS
    - PASS_PHASE1_WITH_REQUIRED_CLAIM_NARROWING
    - STOP_PHASE1_MAJOR_RESULT_CHANGE
    - STOP_PHASE1_INSUFFICIENT_EVIDENCE
