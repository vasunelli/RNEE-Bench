experiment: MODEL_CONTRACT
stage: M4_corrected_null_inference_and_boundary_grading
m3_pointer: results/model_contract_m3_add_drop_latest_pointer.json
original_m4_pointer: results/model_contract_m4_inference_latest_pointer.json
output_root: results/rnee_build
run_name_prefix: model_contract_m4_corrected
latest_prefix: model_contract_m4_corrected

primary_cells:
  - {split_family: random_trip_blocked, target_id: ICE_fuel_L}
  - {split_family: random_trip_blocked, target_id: HEV_fuel_L}
  - {split_family: cold_trip, target_id: ICE_fuel_L}
  - {split_family: cold_trip, target_id: HEV_fuel_L}
  - {split_family: cold_month, target_id: ICE_fuel_L}
  - {split_family: cold_month, target_id: HEV_fuel_L}
  - {split_family: cold_spatial, target_id: ICE_fuel_L}
  - {split_family: cold_spatial, target_id: HEV_fuel_L}
  - {split_family: cold_functional_road_class, target_id: ICE_fuel_L}
  - {split_family: cold_functional_road_class, target_id: HEV_fuel_L}

primary_cold_splits:
  - cold_trip
  - cold_month
  - cold_spatial
  - cold_functional_road_class

canonical_seed: 20260720
wild_bootstrap_replicates: 2000
wild_bootstrap_master_seed: 20260720
wild_bootstrap_method: trip-clustered null-imposed studentized Rademacher multipliers
cluster_unit: trip_uid
cluster_t_sensitivity: two-sided Student t reference with trip-cluster df
effect_equivalence_tolerance: 1.0e-15
fdr_alpha: 0.05
fdr_primary: Benjamini-Hochberg separately within each target_id and add/drop family
dependency_sensitivity: Benjamini-Yekutieli on the same four 25-comparison families

frozen_inputs:
  - M3 canonical-seed paired test predictions
  - original M4 descriptive effect estimates and percentile confidence intervals
  - original M4 hash-verified empirical calibration diagnostics

prohibited:
  - model refitting or hyperparameter selection
  - test-target rematerialization
  - calibration-target rematerialization
  - treating split families as independent replications
  - substantive NO_GAIN grading when a required comparison is a reliability boundary
  - causal or external-transfer claims
