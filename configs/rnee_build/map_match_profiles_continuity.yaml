profiles:
  continuity_candidate:
    gps_accuracy_m: 20
    search_radius_m: 75
    breakage_distance_m: 1000

selection_policy:
  evidence_scope: final_bounded_map_matching_quality_sensitivity
  rationale: ">500 m raw update jumps are already split before matching; a 1000 m Valhalla breakage distance tests whether residual discontinuities are technical matcher fragmentation rather than impossible raw connectors"
  prohibited_selection_inputs:
    - energy_target
    - model_metric
    - eVED_match_fields
  ranking:
    - gate_band
    - matched_coverage_desc
    - distance_p95_asc
    - discontinuity_rate_asc
