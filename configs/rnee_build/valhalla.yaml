experiment: MAP_MATCHING
base_contract: configs/rnee_build/base.yaml
network_pointer: results/network_freeze_latest_network_pointer.json
snapshot_summary: results/network_freeze_latest_summary.json
gps_trip_quality: results/network_freeze_latest_gps_trip_quality.parquet
ved_dynamic_dir: source/ved/extracted
output_root: results/rnee_build

endpoint: trace_attributes
costing: auto
shape_match: map_snap
breakage_distance_m: 500
request_timeout_seconds: 180
maximum_attempts: 3
parallel_workers: 4
pilot_trip_count: 100
pilot_selection_seed: 176

columns:
  vehicle: VehId
  trip: Trip
  timestamp_ms: Timestamp(ms)
  latitude: Latitude[deg]
  longitude: Longitude[deg]

response_attributes:
  - edge.id
  - edge.way_id
  - edge.road_class
  - edge.use
  - edge.length
  - edge.speed_limit
  - edge.lane_count
  - edge.surface
  - edge.tunnel
  - edge.bridge
  - edge.roundabout
  - edge.forward
  - edge.traffic_signal
  - edge.weighted_grade
  - edge.max_upward_grade
  - edge.max_downward_grade
  - edge.mean_elevation
  - matched.point
  - matched.type
  - matched.edge_index
  - matched.begin_route_discontinuity
  - matched.end_route_discontinuity
  - matched.distance_along_edge
  - matched.distance_from_trace_point
  - osm_changeset
