    quality_check_max: 0.05
  silent_fallback_count:
    pass_max: 0
  matched_edge_jump_over_500m_within_10s_rate:
    pass_max: 0.001
    quality_check_max: 0.005
  manual_spatial_audit:
    random_trip_count: 50
    highest_distance_trip_count: 25
    complex_geometry_trip_count: 25
