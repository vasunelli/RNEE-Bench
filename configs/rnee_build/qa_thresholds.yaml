    - maxspeed
    - source:maxspeed
    - lanes
    - oneway
    - access
    - surface
    - smoothness
    - bridge
    - tunnel
    - junction
    - traffic_calming
    - lit

map_matching:
  endpoint: trace_attributes
  costing: auto
  input_point_status_coverage:
    pass_min: 1.0
  matched_point_cardinality:
    pass_equal_input: true
  matched_coverage:
    pass_min: 0.97
    quality_check_min: 0.95
  distance_from_trace_point_m:
