  functional_road_class_missing_rate:
    pass_max: 0.02
    quality_check_max: 0.05
  speed_limit_kmh_anomaly:
    below: 5
    above: 160
  lane_count_anomaly:
    below: 1
    above: 12

row_assembly:
  input_output_row_ratio: 1.0
  duplicate_row_id_count: 0
  status_reason_coverage: 1.0
  exact_coordinate_as_model_feature: false
  entity_identifier_as_model_feature: false

segments_and_splits:
