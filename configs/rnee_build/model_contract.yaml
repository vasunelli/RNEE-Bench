experiment: MODEL_CONTRACT
stage: M1_B1_feature_contract_and_mechanistic_identifiability
differential_audit_pointer: results/differential_audit_latest_pointer.json
segment_pointer: results/segment_split_segments_60s_latest_pointer.json
split_pointer: results/segment_split_splits_latest_pointer.json
row_pointer: results/trajectory_build_row_production_latest_pointer.json
static_vehicle_metadata: results/source_inventory_ved_inventory_20260716_220831/static_vehicle_metadata.parquet
output_root: results/rnee_build
run_name_prefix: model_contract_m1_feature_contract
latest_prefix: model_contract_m1_feature_contract
window_seconds: 60
target_minimum_coverage: 0.95

split_families:
  - random_trip_blocked
  - cold_vehicle
  - cold_trip
  - cold_month
  - cold_spatial
  - cold_functional_road_class

targets:
  ICE_fuel_L:
    engine_type: ICE
    channel: fuel
    column: fuel_volume_L
    coverage_column: fuel_target_coverage
    unit: L
  HEV_fuel_L:
    engine_type: HEV
    channel: fuel
    column: fuel_volume_L
    coverage_column: fuel_target_coverage
    unit: L
  PHEV_fuel_L:
    engine_type: PHEV
    channel: fuel
    column: fuel_volume_L
    coverage_column: fuel_target_coverage
    unit: L
  EV_battery_Wh:
    engine_type: EV
    channel: battery
    column: battery_terminal_net_Wh
    coverage_column: battery_target_coverage
    unit: Wh
  PHEV_battery_Wh:
    engine_type: PHEV
    channel: battery
    column: battery_terminal_net_Wh
    coverage_column: battery_target_coverage
    unit: Wh

support_thresholds:
  minimum_vehicles: 20
  minimum_trips: 200
  minimum_segments: 2000
  maximum_vehicle_segment_share: 0.15

feature_groups:
  R0_LOW_SENSOR:
    exact:
      - effective_duration_s
      - distance_m_speed_integrated
      - vehicle_speed_km_h_time_weighted_mean
      - vehicle_speed_km_h_time_weighted_std
      - oat_degc_time_weighted_mean
      - oat_degc_time_weighted_std
      - idle_ratio
      - low_speed_ratio
  R0_FULL_OBD_ADDITIONS:
    exact:
      - maf_g_sec_time_weighted_mean
      - maf_g_sec_time_weighted_std
      - engine_rpm_rpm_time_weighted_mean
      - engine_rpm_rpm_time_weighted_std
      - absolute_load_pct_time_weighted_mean
      - absolute_load_pct_time_weighted_std
      - fuel_rate_l_hr_time_weighted_mean
      - fuel_rate_l_hr_time_weighted_std
      - air_conditioning_power_kw_time_weighted_mean
      - air_conditioning_power_kw_time_weighted_std
      - air_conditioning_power_watts_time_weighted_mean
      - air_conditioning_power_watts_time_weighted_std
      - heater_power_watts_time_weighted_mean
      - heater_power_watts_time_weighted_std
      - hv_battery_soc_pct_time_weighted_mean
      - hv_battery_soc_pct_time_weighted_std
      - short_term_fuel_trim_bank_1_pct_time_weighted_mean
      - short_term_fuel_trim_bank_1_pct_time_weighted_std
      - short_term_fuel_trim_bank_2_pct_time_weighted_mean
      - short_term_fuel_trim_bank_2_pct_time_weighted_std
      - long_term_fuel_trim_bank_1_pct_time_weighted_mean
      - long_term_fuel_trim_bank_1_pct_time_weighted_std
      - long_term_fuel_trim_bank_2_pct_time_weighted_mean
      - long_term_fuel_trim_bank_2_pct_time_weighted_std
  R1_HIERARCHY_REGULATION:
    exact:
      - road_semantics_distance_coverage
      - functional_road_class_entropy
      - speed_limit_kmh_distance_weighted_mean
      - speed_limit_distance_coverage
      - speed_limit_inferred_distance_share
      - functional_road_class_transition_count
    prefixes:
      - functional_road_class_share_
      - speed_limit_provenance_share_
  R3_TOPOLOGY:
    prefixes:
      - nearest_graph_node_degree_
      - nearest_graph_node_streets_
      - nearest_graph_node_distance_m_
      - dead_end_exposure_
      - edge_density_m_per_km2_250m_
      - orientation_entropy_250m_
  R4_TRAFFIC_PLACE_OBJECTS:
    prefixes:
      - intersection_
      - poi_
      - public_transport_
      - traffic_control_
  R5_BUILT_ENVIRONMENT:
    prefixes:
      - building_coverage_ratio_
      - landuse_coverage_ratio_

target_source_feature_deny:
  fuel:
    - maf_g_sec_time_weighted_mean
    - maf_g_sec_time_weighted_std
    - fuel_rate_l_hr_time_weighted_mean
    - fuel_rate_l_hr_time_weighted_std
    - short_term_fuel_trim_bank_1_pct_time_weighted_mean
    - short_term_fuel_trim_bank_1_pct_time_weighted_std
    - short_term_fuel_trim_bank_2_pct_time_weighted_mean
    - short_term_fuel_trim_bank_2_pct_time_weighted_std
    - long_term_fuel_trim_bank_1_pct_time_weighted_mean
    - long_term_fuel_trim_bank_1_pct_time_weighted_std
    - long_term_fuel_trim_bank_2_pct_time_weighted_mean
    - long_term_fuel_trim_bank_2_pct_time_weighted_std
  battery:
    - hv_battery_current_a_time_weighted_mean
    - hv_battery_current_a_time_weighted_std
    - hv_battery_voltage_v_time_weighted_mean
    - hv_battery_voltage_v_time_weighted_std

forbidden_features:
  exact:
    - segment_id
    - trip_uid
    - VehId
    - Trip
    - source_file
    - fuel_volume_L
    - battery_terminal_net_Wh
    - engine_type
    - spatial_block_id
    - spatial_grid_x
    - spatial_grid_y
    - matched_x_m_centroid
    - matched_y_m_centroid
    - functional_road_class_dominant
    - actual_start_date
    - actual_month
  tokens:
    - segment_id
    - trip_uid
    - vehicle_id
    - vehid
    - route_id
    - road_id
    - edge_id
    - way_id
    - latitude
    - longitude
    - spatial_block
    - spatial_grid
    - target_coverage
    - prediction_usable
    - model_eligible
    - split_role
    - exclusion_reason

preprocessing_contract:
  category_taxonomy: fixed before model fitting; no test-dependent rare-class merge
  numeric_imputation: fit on train only within each split and target
  missingness_indicators: fit/freeze on train only within each split and target
  scaling: fit on train only if the selected backbone requires scaling
  variance_filter: fit on train only
  hyperparameter_selection: validation only
  calibration: calibration partition only and never used for fitting or hyperparameter selection
  test_use: exactly once after all choices are frozen

r2_categorical_contract:
  surface_osm:
    missing_label: missing
    categories: [paved, unpaved, other, missing]
    mapping:
      asphalt: paved
      paved: paved
      concrete: paved
      cobblestone: paved
      bricks: paved
      unpaved: unpaved
      compacted: unpaved
      dirt: unpaved
      wood: other
  smoothness:
    missing_label: missing
    categories: [good, rough, very_rough, other, missing]
    mapping:
      excellent: good
      good: good
      intermediate: good
      bad: rough
      very_bad: rough
      horrible: very_rough
      very_horrible: very_rough
      impassable: very_rough
  oneway:
    missing_label: missing
    categories: [yes, no, reverse, other, missing]
    mapping:
      "yes": yes
      "1": yes
      "true": yes
      "no": no
      "0": no
      "false": no
      "-1": reverse
      reversible: other
  access:
    missing_label: missing
    categories: [open, restricted, other, missing]
    mapping:
      "yes": open
      permissive: open
      private: restricted
      destination: restricted
      "no": restricted
      customers: restricted
  motor_vehicle:
    missing_label: missing
    categories: [open, restricted, other, missing]
    mapping:
      "yes": open
      permissive: open
      private: restricted
      destination: restricted
      "no": restricted
      customers: restricted
  bridge_osm:
    missing_label: missing
    categories: ["true", "false", other, missing]
    mapping:
      "true": "true"
      "1": "true"
      "yes": "true"
      "false": "false"
      "0": "false"
      "no": "false"
  tunnel_osm:
    missing_label: missing
    categories: ["true", "false", other, missing]
    mapping:
      "true": "true"
      "1": "true"
      "yes": "true"
      "false": "false"
      "0": "false"
      "no": "false"
  roundabout_osm:
    missing_label: missing
    categories: ["true", "false", other, missing]
    mapping:
      "true": "true"
      "1": "true"
      "yes": "true"
      "false": "false"
      "0": "false"
      "no": "false"

r2_non_feature_columns:
  - r2_total_distance_m
  - r2_road_available_distance_m
  - r2_road_distance_coverage

static_parameter_fields:
  - Vehicle Type
  - Vehicle Class
  - Engine Configuration & Displacement
  - Transmission
  - Drive Wheels
  - Generalized_Weight
  - EngineType_official

mechanistic_requirements:
  fuel:
    - {parameter: exact_vehicle_mass_kg, essential: true, status: UNAVAILABLE, evidence: only coarse Generalized_Weight without an exact SI-mass contract}
    - {parameter: road_grade_profile, essential: true, status: PARTIAL, evidence: edge grade exists upstream but is absent from the frozen segment release and lacks exact vehicle parameters}
    - {parameter: rolling_resistance_coefficient, essential: true, status: UNAVAILABLE, evidence: no official per-vehicle parameter}
    - {parameter: drag_coefficient_times_frontal_area, essential: true, status: UNAVAILABLE, evidence: no official per-vehicle parameter}
    - {parameter: engine_efficiency_or_bsfc_map, essential: true, status: UNAVAILABLE, evidence: no efficiency or BSFC map}
    - {parameter: fuel_lower_heating_value_and_density_by_vehicle, essential: true, status: UNAVAILABLE, evidence: only nominal MAF target constants exist and are not a calibrated propulsion model}
    - {parameter: gearbox_and_wheel_parameters, essential: true, status: UNAVAILABLE, evidence: transmission text is incomplete and gear ratios/wheel radius are absent}
  battery:
    - {parameter: exact_vehicle_mass_kg, essential: true, status: UNAVAILABLE, evidence: only coarse Generalized_Weight without an exact SI-mass contract}
    - {parameter: road_grade_profile, essential: true, status: PARTIAL, evidence: edge grade exists upstream but is absent from the frozen segment release and lacks exact vehicle parameters}
    - {parameter: rolling_resistance_coefficient, essential: true, status: UNAVAILABLE, evidence: no official per-vehicle parameter}
    - {parameter: drag_coefficient_times_frontal_area, essential: true, status: UNAVAILABLE, evidence: no official per-vehicle parameter}
    - {parameter: drivetrain_efficiency_map, essential: true, status: UNAVAILABLE, evidence: no motor-inverter-drivetrain efficiency map}
    - {parameter: regenerative_efficiency_and_limits, essential: true, status: UNAVAILABLE, evidence: no regenerative efficiency or power-limit map}
    - {parameter: complete_auxiliary_power, essential: true, status: PARTIAL, evidence: selected HVAC channels exist but not total auxiliary load}

transparent_reference:
  name: transparent_kinematic_environmental_reference
  status: REQUIRED_NOT_A_MECHANISTIC_MODEL
  calibration: coefficients fit on train only; model class and transforms frozen before test
  candidate_inputs:
    - effective_duration_s
    - distance_m_speed_integrated
    - vehicle_speed_km_h_time_weighted_mean
    - vehicle_speed_km_h_time_weighted_std
    - idle_ratio
    - low_speed_ratio
    - oat_degc_time_weighted_mean
    - oat_degc_time_weighted_std
  claim_boundary: interpretable statistical reference using motion and environment proxies; not a complete force-balance or powertrain model
