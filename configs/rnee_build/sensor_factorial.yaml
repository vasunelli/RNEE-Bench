experiment: SENSOR_FACTORIAL
stage: RNEE_retrospective_sensor_road_factorial

# SENSOR_FACTORIAL is an exploratory sensor-and-road comparison on the published RNEE corpus. It
# does not modify the frozen model or information contracts and does not establish independent confirmation.
m1_pointer: results/model_contract_m1_feature_contract_latest_pointer.json
m2_pointer: results/model_contract_m2_backbone_smoke_latest_pointer.json
segment_pointer: results/segment_split_segments_60s_latest_pointer.json
information_freeze_pointer: RUN_ROOT/model_contract/information_contract_latest_pointer.json

output_root: RUN_ROOT/sensor_factorial
run_name_prefix: sensor_factorial
latest_prefix: sensor_factorial

evidence_contract:
  evidence_class: EXPLORATORY_SENSOR_ROAD_COMPARISON
  published_test_corpus_fixed_by_model_contract: true
  model_contract_authoritative_artifacts_immutable: true
  information_freeze_status_unchanged: true
  cross_dataset_evidence_used: false
  independent_confirmation_included: false

scope:
  systems:
    - L-R0
    - L-R1
    - H-R0
    - H-R1
  primary_target: ICE_fuel_L
  supporting_target: HEV_fuel_L
  cold_splits:
    - cold_trip
    - cold_month
    - cold_spatial
    - cold_functional_road_class
  reference_split: random_trip_blocked
  seeds:
    - 20260720
    - 20260721
    - 20260722
  minimum_train_rows: 500
  primary_metric: MAE
  secondary_metrics:
    - RMSE
    - MedAE
    - R2
  target_source_support:
    mode: frozen_model_contract_target_safe_operational_fuel
    target: operational_fuel_L_with_direct_or_MAF_source
    high_sensor_contract: target_specific_MODEL_CONTRACT_R0_with_all_target_source_channels_removed
    excluded_channels:
      - direct_Fuel_Rate
      - MAF
      - short_term_fuel_trim
      - long_term_fuel_trim
    rationale: pure_direct_support_is_insufficient_and_target_source_channels_must_not_enter_predictors

inference:
  cluster_level: vehicle
  bootstrap_replicates: 2000
  bootstrap_seed: 20260725
  simultaneous_family_alpha: 0.05
  relative_sesoi: 0.055
  interaction_relative_sesoi: 0.055
  ensemble_rule: arithmetic_mean_prediction_across_frozen_seeds
  cross_ood_rule: at_least_three_of_four_practical_positive_and_zero_practical_negative

# These are prospective INFORMATION_FREEZE floors. They are audited but do not suppress
# descriptive SENSOR_FACTORIAL estimates; failure keeps every result exploratory.
prospective_support_audit:
  minimum_vehicles: 30
  minimum_trips: 5129
  minimum_segments: 30774
  maximum_single_vehicle_segment_share: 0.15

reporting:
  save_segment_predictions: true
  forbid_mape_smape: true
  prohibit_causal_claims: true
  prohibit_external_transfer_claims: true
  prohibit_confirmed_language: true
