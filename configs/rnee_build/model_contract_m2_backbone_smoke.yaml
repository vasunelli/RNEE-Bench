experiment: MODEL_CONTRACT
stage: M2_validation_only_backbone_selection_smoke
m1_pointer: results/model_contract_m1_feature_contract_latest_pointer.json
segment_pointer: results/segment_split_segments_60s_latest_pointer.json
output_root: results/rnee_build
run_name_prefix: model_contract_m2_backbone_smoke
latest_prefix: model_contract_m2_backbone_smoke

primary_supported_cells:
  - {split_family: random_trip_blocked, target_id: ICE_fuel_L}
  - {split_family: random_trip_blocked, target_id: HEV_fuel_L}
  - {split_family: cold_trip, target_id: ICE_fuel_L}
  - {split_family: cold_trip, target_id: HEV_fuel_L}
  - {split_family: cold_month, target_id: ICE_fuel_L}
  - {split_family: cold_month, target_id: HEV_fuel_L}
  - {split_family: cold_spatial, target_id: ICE_fuel_L}
  - {split_family: cold_spatial, target_id: HEV_fuel_L}
  - {split_family: cold_functional_road_class, target_id: ICE_fuel_L}
  - {split_family: cold_functional_road_class, target_id: HEV_fuel_L}

smoke_seed: 20260720
smoke_max_train_rows: 20000
smoke_max_validation_rows: 5000
minimum_smoke_train_rows: 500
minimum_smoke_validation_rows: 100
memory_ceiling_gb: 12.0

selection_criterion:
  primary: minimum equal-cell mean of validation MAE divided by train target IQR
  tie_break_1: minimum equal-cell median normalized validation MAE
  tie_break_2: minimum total fit-plus-predict time
  test_involvement: prohibited
  calibration_involvement: prohibited
  cross_split_protection: for each target, exclude every segment assigned calibration or test in any primary split before reading target values for M2
  train_only_variance_filter: retain only columns with at least two distinct observed training values within each target/split; never inspect validation/calibration/test variance

candidate_models:
  lightgbm_l1:
    kind: lightgbm
    backend: cpu
    params:
      objective: regression_l1
      n_estimators: 200
      learning_rate: 0.05
      num_leaves: 31
      min_child_samples: 30
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0
      n_jobs: 8
      device_type: cpu
      verbosity: -1
  xgboost_l1:
    kind: xgboost
    backend: cpu
    params:
      objective: reg:absoluteerror
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 6
      min_child_weight: 5
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0
      tree_method: hist
      device: cpu
      n_jobs: 8
      verbosity: 0
  hist_gradient_boosting_l1:
    kind: hist_gradient_boosting
    backend: cpu
    params:
      loss: absolute_error
      learning_rate: 0.05
      max_iter: 200
      max_leaf_nodes: 31
      min_samples_leaf: 30
      l2_regularization: 1.0
      early_stopping: false

transparent_reference:
  name: transparent_kinematic_environmental_ridge
  claim_status: STATISTICAL_REFERENCE_NOT_MECHANISTIC
  alpha: 10.0
  preprocessing: train-only median imputation, missingness indicators, feature scaling and target scaling

m3_seeds: [20260720, 20260721, 20260722]
