experiment: MODEL_CONTRACT
stage: M4_clustered_inference_fdr_calibration_reliability
m1_pointer: results/model_contract_m1_feature_contract_latest_pointer.json
m3_pointer: results/model_contract_m3_add_drop_latest_pointer.json
segment_pointer: results/segment_split_segments_60s_latest_pointer.json
output_root: results/rnee_build
run_name_prefix: model_contract_m4_inference
latest_prefix: model_contract_m4_inference

primary_cells:
  - {split_family: random_trip_blocked, target_id: ICE_fuel_L}
  - {split_family: random_trip_blocked, target_id: HEV_fuel_L}
  - {split_family: cold_trip, target_id: ICE_fuel_L}
  - {split_family: cold_trip, target_id: HEV_fuel_L}
  - {split_family: cold_month, target_id: ICE_fuel_L}
  - {split_family: cold_month, target_id: HEV_fuel_L}
  - {split_family: cold_spatial, target_id: ICE_fuel_L}
  - {split_family: cold_spatial, target_id: HEV_fuel_L}
  - {split_family: cold_functional_road_class, target_id: ICE_fuel_L}
  - {split_family: cold_functional_road_class, target_id: HEV_fuel_L}

primary_cold_splits:
  - cold_trip
  - cold_month
  - cold_spatial
  - cold_functional_road_class

canonical_seed: 20260720
audit_seeds: [20260720, 20260721, 20260722]
seed_equivalence_tolerance: 0.0

bootstrap_replicates: 2000
bootstrap_master_seed: 20260720
cluster_unit: trip_uid
confidence_level: 0.95
p_value: two-sided bootstrap sign-tail with add-one correction

fdr_alpha: 0.05
fdr_primary: Benjamini-Hochberg separately within each target_id and add/drop family
dependency_sensitivity: Benjamini-Yekutieli on the same families
grade_support_rule: requires CI direction, BH and BY q <= 0.05, and joint calibration reliability

coverage_levels: [0.90, 0.95]
primary_coverage: 0.90
conformal_score: absolute residual
conformal_quantile: finite-sample ceil((n+1)*coverage) order statistic
local_coverage_strata: calibration absolute-target quartiles
minimum_local_test_rows: 200
marginal_undercoverage_tolerance: 0.02
worst_local_undercoverage_tolerance: 0.05

memory_ceiling_gb: 12.0

prohibited:
  - model refitting or hyperparameter selection
  - test-target rematerialization
  - treating split families as independent replications
  - treating three deterministic seed copies as additional inferential samples
  - pooling ICE and HEV targets or adding downgraded cells
  - MAPE, sMAPE, legacy eVED metrics, causal or external-transfer claims
