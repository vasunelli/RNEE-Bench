experiment: MAP_MATCHING
policy_name: quality_1_quality_remediation_v1
quality_rating_column: quality_rating
allowed_ratings:
  - correct
  - minor
  - incorrect

raw_gps_break_rules:
  nonpositive_update_time: true
  maximum_coordinate_update_speed_kmh: 200
  maximum_coordinate_update_jump_m: 500

actions:
  raw_gps_triggered_incorrect: split_at_flagged_update_transition
  incorrect_without_raw_gps_trigger: retain_as_map_match_error_candidate
  delete_original_trip: false
  preserve_all_l0_rows: true
  rerun_map_matching_after_split: true
  require_quality_1_rerating_after_rerun: true

prohibited:
  - delete_trip_because_quality_check_rating_is_incorrect
  - use_energy_target_for_exclusion
  - use_model_performance_for_exclusion
  - silent_coordinate_or_semantic_fill

