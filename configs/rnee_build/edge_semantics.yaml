experiment: EDGE_SEMANTICS
map_match_pointer: results/map_matching_latest_segmented_raw_pointer.json
map_matching_close_decision: results/map_matching_latest_close_decision.json
network_pointer: results/network_freeze_latest_network_pointer.json
output_root: results/rnee_build
selected_profile: balanced_final

join_contract:
  keys:
    - osm_snapshot_id
    - way_id
  prohibit_coordinate_nearest_join: true

functional_road_class:
  motorway:
    - motorway
    - motorway_link
  trunk:
    - trunk
    - trunk_link
  primary:
    - primary
    - primary_link
  secondary:
    - secondary
    - secondary_link
  tertiary:
    - tertiary
    - tertiary_link
  local:
    - residential
    - unclassified
    - living_street
    - road
  service:
    - service
  other:
    - track
    - path
    - cycleway
    - footway
    - pedestrian
    - construction

speed:
  mph_to_kmh: 1.609344
  anomaly_below_kmh: 5
  anomaly_above_kmh: 160
  provenance_values:
    - explicit
    - directional
    - advisory
    - practical
    - default
    - missing
  valhalla_fallback_provenance: default
  valhalla_fallback_is_inferred: true

lane:
  anomaly_below: 1
  anomaly_above: 12

osm_tags:
  - highway
  - maxspeed
  - maxspeed:forward
  - maxspeed:backward
  - maxspeed:advisory
  - maxspeed:practical
  - lanes
  - lanes:forward
  - lanes:backward
  - surface
  - smoothness
  - oneway
  - access
  - motor_vehicle
  - bridge
  - tunnel
  - junction
  - service

qa:
  functional_class_missing_rate_pass_max: 0.03
  functional_class_missing_rate_quality_check_max: 0.05
  speed_provenance_coverage_min: 1.0
